name: Build Docker image for ingestion jobs and push to GCR
on:
  push:
    branches:
    - '*'
    paths:
    - 'ingest/**'
  workflow_dispatch:

env:
  PROJECT_ID: ${{ secrets.PROJECT_ID }}
  IMAGE: eoapi-risk-ingest

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@ee0669bd1cc54295c223e0bb666b733df41de1c5 # v2

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@f211e3e9ded2d9377c8cadc4489a4e38014bc4c9 # v1

    - name: Login to Google Container Registry
      uses: docker/login-action@dd4fa0671be5250ee6f50aedf4cb05514abda2c7 # v1
      with:
        registry: gcr.io
        username: _json_key
        password: ${{ secrets.GOOGLE_CREDENTIALS }}

    - name: Shorten git SHA
      id: shorten_sha
      run: echo "SHORT_SHA=$(echo ${{ github.sha }} | cut -c1-7)" >> $GITHUB_ENV

    - name: Build and push Docker image
      uses: docker/build-push-action@0a97817b6ade9f46837855d676c4cca3a2471fc9 # v4
      with:
        context: ingest
        push: true
        tags: gcr.io/${{ env.PROJECT_ID }}/${{ env.IMAGE }}:${{ github.ref_name == 'main' && 'latest' || env.SHORT_SHA }}

